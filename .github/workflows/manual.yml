name: Forward Port from 6

on:
  push:
    branches:
      - "6"

jobs:
  forward-port:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Define target branches
        id: vars
        run: |
          echo "targets=7 master" >> $GITHUB_OUTPUT

      - name: Forward port to all branches
        run: |
          targets=(${{ steps.vars.outputs.targets }})
          for TO in "${targets[@]}"; do
            echo "Creating PR: 6 → $TO"

            BRANCH="forward-6-to-$TO-$(date +%s)"
            git checkout -b $BRANCH

            git merge origin/6 --no-ff -m "Forward-port: merge 6 into $TO" || true

            git push origin $BRANCH || true

            gh pr create \
              --title "Forward-port: 6 → $TO" \
              --body "自动同步：将 **6** 分支的更改同步到 **$TO**。" \
              --base $TO \
              --head $BRANCH || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
